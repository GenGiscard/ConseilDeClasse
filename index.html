/* ---------- import CSV ---------- */
function parseCSV(text){
  text = text.replace(/^﻿/,"");
  const first = text.split(/\r?\n/).find(l=>l.trim()) || "";
  const sep = (first.match(/\t/g)||[]).length ? "\t" : ((first.match(/;/g)||[]).length >= (first.match(/,/g)||[]).length ? ";" : ",");
  const rows = []; let row = [], cell = "", q = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q = false; }
      else cell += c;
    } else if(c==='"') q = true;
    else if(c===sep){ row.push(cell); cell=""; }
    else if(c==="\n" || c==="\r"){ if(c==="\r" && text[i+1]==="\n") i++; row.push(cell); rows.push(row); row=[]; cell=""; }
    else cell += c;
  }
  row.push(cell); rows.push(row);
  return rows.map(r=>r.map(x=>x.trim())).filter(r=>r.some(x=>x!==""));
}
function splitEleve(v){
  const parts = v.trim().split(/\s+/); const nom = [], pre = [];
  parts.forEach(p => (pre.length===0 && p===p.toUpperCase() && /[A-Z]/i.test(norm(p))) ? nom.push(p) : pre.push(p));
  if(!nom.length) return {nom:parts[0]||"", prenom:parts.slice(1).join(" ")};
  if(!pre.length && nom.length>1) pre.push(nom.pop());
  return {nom:nom.join(" "), prenom:pre.join(" ")};
}
const NAME_RE = /^[A-ZÀ-ÖØ-Þ][A-ZÀ-ÖØ-Þ'’ -]*\s+\S/;
const STOP_RE = /^(moyenne|note |notes|%|edite|service de notation|groupes|coefficients|total|effectif|min|max)/;
function prettySubject(h){
  h = String(h).trim();
  const k = norm(h); if(SUBJ_NAMES[k]) return SUBJ_NAMES[k];
  return h===h.toUpperCase() ? h.charAt(0)+h.slice(1).toLowerCase() : h;
}
function rowsToStudents(rows){
  rows = rows.map(r=>Array.from(r||[], x=>x==null?"":String(x).trim()));
  if(!rows.length) return [];
  let hi = rows.slice(0,15).findIndex(r=>r.some(c=>{ const h = norm(c); return h.startsWith("moy") || h==="nom" || h.includes("prenom") || h.includes("eleve"); }));
  const hasHeader = hi>=0;
  const H = hasHeader ? rows[hi].map(norm) : [];
  const find = f => H.findIndex(f);
  let iNom = find(h=>h==="nom" || (h.startsWith("nom") && !h.includes("prenom"))),
      iPre = find(h=>h.includes("prenom")),
      iEl  = find(h=>h.includes("eleve") && !h.includes("\n")),
      iMoy = find(h=>h.startsWith("moy") && (h.includes("gen") || h==="moyenne" || h==="moyennes")),
      iTec = find(h=>h.startsWith("techno") || h==="tech"),
      iRang = find(h=>h.startsWith("rang"));
  if(iMoy<0) iMoy = find(h=>h.startsWith("moy"));
  /* fiche de saisie Pronote d'une matière : « TROISIEME C / TECHNOLOGIE », colonnes Elèves | T1 | A | Appréciation */
  const title = hasHeader ? norm(rows.slice(0,hi).map(r=>r.join(" ")).join(" ")) : "";
  const iPer = find(h=>/^[ts][123]$/.test(h)), iApp = find(h=>h.startsWith("appreciation")), iAbs = find(h=>h==="a");
  const subjectSheet = iPer>=0 && iApp>=0;
  const technoSheet = subjectSheet && title.includes("technologie");
  if(technoSheet && iTec<0) iTec = iPer;
  let data = hasHeader ? rows.slice(hi+1) : rows;
  if(!hasHeader){ iNom = 0; iPre = 1; iMoy = 2; }
  if(hasHeader && iNom<0 && iEl<0){
    let best = -1, bestN = 0;
    const w = Math.max(...data.map(r=>r.length), 0);
    for(let c=0;c<w;c++){ const n = data.filter(r=>NAME_RE.test(r[c]||"")).length; if(n>bestN){ bestN = n; best = c; } }
    iEl = best;
  }
  const isStudent = r => {
    const v = iNom>=0 ? r[iNom] : iEl>=0 ? r[iEl] : "";
    return !!v && !STOP_RE.test(norm(v));
  };
  data = data.filter(isStudent);
  const used = new Set([iNom,iPre,iEl,iMoy,iTec,iRang,iPer,iApp,iAbs].filter(i=>i>=0));
  const matCols = hasHeader ? rows[hi].map((h,i)=>[h,i]).filter(([h,i])=>{
    const n = norm(h);
    return !used.has(i) && n && !n.startsWith("redoubl") && !n.includes("\n") && data.some(r=>parseNum(r[i])!=null);
  }) : [];
  const out = data.map(r=>{
    let nom = "", prenom = "";
    if(iNom>=0 && r[iNom]) { nom = r[iNom]; prenom = iPre>=0 ? (r[iPre]||"") : ""; if(iPre<0 && nom.includes(" ")){ const s = splitEleve(nom); nom = s.nom; prenom = s.prenom; } }
    else if(iEl>=0 && r[iEl]) { const s = splitEleve(r[iEl]); nom = s.nom; prenom = s.prenom; }
    if(!nom && !prenom) return null;
    const mat = {}; matCols.forEach(([h,i])=>{ const n = parseNum(r[i]); if(n!=null) mat[prettySubject(h)] = n; });
    const st = newStudent({nom:nom.toUpperCase(), prenom, moy:iMoy>=0?parseNum(r[iMoy]):null, techno:iTec>=0?parseNum(r[iTec]):null, rang:iRang>=0?parseNum(r[iRang]):null, mat});
    if(technoSheet && r[iApp]) st.appTechno = r[iApp];
    return st;
  }).filter(Boolean);
  out.subjects = hasHeader ? rows[hi].map((h,i)=>[h,i]).filter(([h,i])=>{
    const n = norm(h);
    return !used.has(i) && n && !n.includes("\n") && !n.startsWith("redoubl") && (SUBJ_NAMES[n] || matCols.some(m=>m[1]===i));
  }).map(([h])=>prettySubject(h)).filter((v,i,a)=>a.indexOf(v)===i) : [];
  if(subjectSheet) out.subjects = [];
  out.kind = technoSheet ? "techno" : subjectSheet ? "matiere" : "recap";
  return out;
}
/* Pronote : « 5D - CINQUIEME D / 1er Trimestre » dans les premières lignes */
const LEVELS = {sixieme:"6", cinquieme:"5", quatrieme:"4", troisieme:"3"};
function metaFrom(txt){
  const raw = String(txt||"");
  const n = norm(raw).replace(/[_]+/g," ");
  let cls = null;
  const m1 = raw.match(/(?:^|\s)([3-6](?:PM|[A-Z]))\s*-\s/);
  if(m1 && CLASSES.includes(m1[1])) cls = m1[1];
  if(!cls){
    const m2 = n.match(/\b(sixieme|cinquieme|quatrieme|troisieme)[\s-]+(prepa[\s-]*metiers?|pm|[a-z])\b/);
    if(m2){ const c = LEVELS[m2[1]] + (m2[2].length===1 ? m2[2].toUpperCase() : "PM"); if(CLASSES.includes(c)) cls = c; }
  }
  if(!cls){ const m3 = n.match(/\b([3-6])(?:e|eme)?[\s-]?(pm|[a-e])\b/); if(m3){ const c = m3[1]+m3[2].toUpperCase(); if(CLASSES.includes(c)) cls = c; } }
  const t = n.match(/\b([123])\s*(?:er|e|eme)?\s+trimestre\b/) || n.match(/\btrimestre[\s-]*([123])\b/);
  return { cls, tri: t ? "T"+t[1] : null };
}
function detectMeta(rows, fname){
  const head = metaFrom(rows.slice(0,6).map(r=>Array.from(r||[]).join(" ")).join("\n"));
  const file = metaFrom(String(fname||"").replace(/\.[a-z]+$/i,"").replace(/[_-]+/g," "));
  return { cls: head.cls || file.cls, tri: head.tri || file.tri };
}

/* ---------- lecture .xlsx sans bibliothèque (zip + XML) ---------- */
async function inflateRaw(bytes){
  const ds = new DecompressionStream("deflate-raw");
  const out = new Response(new Blob([bytes]).stream().pipeThrough(ds));
  return new Uint8Array(await out.arrayBuffer());
}
async function unzip(buf){
  const u8 = new Uint8Array(buf), dv = new DataView(buf), files = {};
  let e = u8.length - 22;
  while(e >= 0 && dv.getUint32(e,true)!==0x06054b50) e--;
  if(e < 0) throw new Error("zip");
  let p = dv.getUint32(e+16,true); const n = dv.getUint16(e+10,true);
  const dec = new TextDecoder();
  for(let i=0;i<n;i++){
    const method = dv.getUint16(p+10,true), csize = dv.getUint32(p+20,true);
    const nl = dv.getUint16(p+28,true), xl = dv.getUint16(p+30,true), cl = dv.getUint16(p+32,true), lo = dv.getUint32(p+42,true);
    const name = dec.decode(u8.subarray(p+46, p+46+nl));
    files[name] = {method, csize, lo};
    p += 46+nl+xl+cl;
  }
  return async name => {
    const f = files[name]; if(!f) return null;
    const start = f.lo + 30 + dv.getUint16(f.lo+26,true) + dv.getUint16(f.lo+28,true);
    const raw = u8.subarray(start, start+f.csize);
    return dec.decode(f.method===0 ? raw : await inflateRaw(raw));
  };
}
function colIndex(ref){
  const L = ref.replace(/\d+/g,""); let n = 0;
  for(const ch of L) n = n*26 + (ch.charCodeAt(0)-64);
  return n-1;
}
async function readXlsx(buf){
  const get = await unzip(buf);
  const P = new DOMParser();
  const tx = el => Array.from(el.getElementsByTagName("t")).map(t=>t.textContent).join("");
  const ssx = await get("xl/sharedStrings.xml");
  const shared = ssx ? Array.from(P.parseFromString(ssx,"application/xml").getElementsByTagName("si")).map(tx) : [];
  let sheetPath = "xl/worksheets/sheet1.xml";
  const wb = await get("xl/workbook.xml"), rels = await get("xl/_rels/workbook.xml.rels");
  if(wb && rels){
    const s0 = P.parseFromString(wb,"application/xml").getElementsByTagName("sheet")[0];
    const rid = s0 && (s0.getAttribute("r:id") || s0.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships","id"));
    const rel = Array.from(P.parseFromString(rels,"application/xml").getElementsByTagName("Relationship")).find(r=>r.getAttribute("Id")===rid);
    if(rel){ const t = rel.getAttribute("Target"); sheetPath = t.startsWith("/") ? t.slice(1) : "xl/"+t; }
  }
  const sx = await get(sheetPath);
  if(!sx) throw new Error("sheet");
  const rows = [];
  Array.from(P.parseFromString(sx,"application/xml").getElementsByTagName("row")).forEach(rw=>{
    const ri = (+rw.getAttribute("r") || rows.length+1) - 1, row = [];
    Array.from(rw.getElementsByTagName("c")).forEach(c=>{
      const t = c.getAttribute("t"), v = c.getElementsByTagName("v")[0];
      let val = "";
      if(t==="s") val = v ? (shared[+v.textContent] || "") : "";
      else if(t==="inlineStr") val = tx(c);
      else val = v ? v.textContent : "";
      row[colIndex(c.getAttribute("r")||"A")] = val;
    });
    rows[ri] = row;
  });
  return Array.from(rows, r=>r||[]);
}

function doImport(text, fname){ const rows = parseCSV(text); return doImportRows(rows, detectMeta(rows, fname), {fname}); }
/* opts.strict : ne pas se rabattre sur les menus de l'onglet Données (glisser-déposer) ; opts.quiet : pas de rendu ni de toast */
function doImportRows(rows, meta, opts){
  opts = opts || {}; meta = meta || {};
  const selC = document.getElementById("impCls"), selT = document.getElementById("impTri");
  const cls = meta.cls || (!opts.strict && selC ? selC.value : null);
  const tri = meta.tri || (!opts.strict && selT ? selT.value : null);
  const fname = opts.fname || "Fichier";
  if(!cls || !tri){
    ui.dropRows = {rows, fname, meta};
    state.cur.view = "data";
    ui.importMsg = `${fname} : ${!cls && !tri ? "classe et trimestre non reconnus" : !cls ? "classe non reconnue" : "trimestre non reconnu"}. Choisissez-les ci-dessous puis cliquez sur Importer.`;
    if(!opts.quiet){ render(); if(meta.cls && selC) selC.value = meta.cls; if(meta.tri && selT) selT.value = meta.tri; }
    return {ok:false, msg:ui.importMsg};
  }
  ui.dropRows = null;
  const mode = opts.strict ? "merge" : ((document.querySelector('input[name="impMode"]:checked')||{}).value || "merge");
  const list = rowsToStudents(rows);
  if(!list.length){ ui.importMsg = `${fname} : aucun élève reconnu.`; if(!opts.quiet) render(); return {ok:false, msg:ui.importMsg}; }
  const b = book(cls,tri);
  if(b.example){ b.students = []; b.example = false; b.bilan = ""; }
  let added = 0, updated = 0;
  if(mode==="replace"){ b.students = list; added = list.length; }
  else {
    const idx = new Map(b.students.map(s=>[norm(full(s)), s]));
    list.forEach(n=>{
      const o = idx.get(norm(full(n)));
      if(o){ if(n.moy!=null) o.moy = n.moy; if(n.rang!=null) o.rang = n.rang; if(n.techno!=null) o.techno = n.techno; if(Object.keys(n.mat).length) o.mat = n.mat;
        if(n.appTechno && !o.appTechno.trim()) o.appTechno = n.appTechno; updated++; }
      else { b.students.push(n); added++; }
    });
  }
  if(list.subjects && list.subjects.length)b.subjects = list.subjects;
  state.cur.cls = cls; state.cur.tri = tri;
  const what = list.kind==="techno" ? "notes de techno" : list.kind==="matiere" ? "liste" : "moyennes";
  ui.importMsg = `${cls} · ${triLabel(tri)} (${what}) : ${added} ajouté${added>1?"s":""}, ${updated} mis à jour.`;
  save();
  if(!opts.quiet){ render(); toast(ui.importMsg); }
  return {ok:true, msg:ui.importMsg, cls, tri, kind:list.kind};
}
async function readAnyFile(f){
  if(/\.xlsx$/i.test(f.name)) return readXlsx(await f.arrayBuffer());
  if(/\.(csv|txt|tsv)$/i.test(f.name)) return parseCSV(await f.text());
  throw new Error("type");
}
async function importFiles(files){
  const list = Array.from(files||[]);
  if(!list.length) return;
  const done = [], fails = [];
  let pending = null;
  for(const f of list){
    let rows;
    try{ rows = await readAnyFile(f); }
    catch(e){ fails.push(f.name + (e.message==="type" ? " (format non pris en charge)" : " (lecture impossible)")); continue; }
    const r = doImportRows(rows, detectMeta(rows, f.name), {strict:true, quiet:true, fname:f.name});
    if(r.ok) done.push(r); else if(ui.dropRows) pending = ui.dropRows; else fails.push(r.msg);
  }
  if(pending) ui.dropRows = pending;
  if(done.length && !pending){
    const last = done[done.length-1];
    state.cur.cls = last.cls; state.cur.tri = last.tri;
    if(last.kind==="techno") state.cur.view = "techno";
    else if(state.cur.view==="data") state.cur.view = "prep";
  }
  ui.importMsg = done.length===1 && !pending && !fails.length ? done[0].msg :
    [done.length ? `${done.length} fichier${done.length>1?"s":""} importé${done.length>1?"s":""} : ${done.map(d=>d.cls+" "+d.tri).join(", ")}.` : "",
     pending ? `${pending.fname} : classe ou trimestre non reconnus, choisissez-les puis cliquez sur Importer.` : "",
     fails.length ? "Non importé : " + fails.join(" ; ") : ""].filter(Boolean).join(" ");
  if(pending) state.cur.view = "data";
  save(); render(); toast(ui.importMsg);
  if(pending){
    const selC = document.getElementById("impCls"), selT = document.getElementById("impTri");
    if(pending.meta.cls && selC) selC.value = pending.meta.cls;
    if(pending.meta.tri && selT) selT.value = pending.meta.tri;
  }
}

/* ---------- actions ---------- */
function setMention(s, k){ s.mention = k; }
function act(el){
  const a = el.dataset.act, id = el.dataset.id;
  const b = book();
  switch(a){
    case "view": state.cur.view = el.dataset.v; ui.ask = null; save(); render(); try{ window.scrollTo(0,0); }catch(e){} break;
    case "mention": { const s = findStudent(id); if(s){ setMention(s, el.dataset.k); save(); render(); } break; }
    case "garde": { const s = findStudent(id); if(s){ s.garde[el.dataset.k] = !s.garde[el.dataset.k]; save(); render(); } break; }
    case "toggle-open": ui.open = ui.open===id ? null : id; render(); break;
    case "add-student": {
      if(b.example){ b.students = []; b.example = false; b.bilan = ""; }
      const s = newStudent({nom:"NOUVEL", prenom:"Élève"}); b.students.push(s);
      state.cur.view = "prep"; ui.open = s.id; ui.q = ""; save(); render();
      const f = document.getElementById("nm-"+s.id); if(f){ f.focus(); f.select(); }
      break; }
    case "propose": {
      const t = state.seuils; let n = 0;
      b.students.forEach(s=>{
        if(s.mention || s.garde.travail || s.garde.comportement || s.moy==null) return;
        const k = s.moy>=t.fel ? "fel" : s.moy>=t.comp ? "comp" : s.moy>=t.enc ? "enc" : "";
        if(k){ s.mention = k; n++; }
      });
      save(); render(); toast(n ? `${n} mention${n>1?"s":""} proposée${n>1?"s":""}` : "Aucune nouvelle proposition"); break; }
    case "goto": ui.idx = +el.dataset.i; render(); break;
    case "prev": ui.idx--; render(); break;
    case "next-vu": {
      const list = sorted(b.students,"nom"); const s = list[ui.idx];
      if(s) s.vu = true;
      if(ui.idx < list.length-1) ui.idx++; else toast("Tous les élèves sont passés");
      save(); render(); break; }
    case "timer":
      if(ui.timer.run){ ui.timer.acc += Date.now()-ui.timer.t0; ui.timer.run = false; }
      else { ui.timer.t0 = Date.now(); ui.timer.run = true; }
      render(); break;
    case "timer-reset": ui.timer = {run:false, t0:0, acc:0}; render(); break;
    case "add-prof": ensureProfs(b); b.profs.push({id:uid(), matiere:"Nouvelle matière", prof:"", bilan:""}); save(); render(); break;
    case "ai-bilan": aiBilan(); break;
    case "task": {
      const bb = state.data[el.dataset.bk]; if(!bb) break;
      const s = bb.students.find(x=>x.id===id); if(!s) break;
      const k = norm(el.dataset.t); s.doneTasks = s.doneTasks || [];
      if(el.checked){ if(!s.doneTasks.includes(k)) s.doneTasks.push(k); } else s.doneTasks = s.doneTasks.filter(x=>x!==k);
      save(); render(); break; }
    case "quick": {
      const s = findStudent(id); if(!s) break;
      const q = QUICK[+el.dataset.q];
      if(!tasksOf(s).some(x=>x.t===q)) s.notes = (s.notes.trim() ? s.notes.replace(/\s+$/,"")+"\n" : "") + q;
      save(); render(); break; }
    case "act-scope": ui.actScope = el.dataset.v; render(); break;
    case "act-show": ui.actShow = el.dataset.v; render(); break;
    case "copy-actions": copyText(actionsText(), "Liste des actions"); break;
    case "gen-bilan": b.bilanBy = ""; b.bilanAuto = true; b.bilan = summarizeBilans(b); save(); render(); toast("Résumé recalculé"); break;
    case "cr-copy": copyText(crText(b), "Compte-rendu"); break;
    case "cr-dl": download(`conseil-${state.cur.cls}-${state.cur.tri}.txt`, crText(b)); break;
    case "tsv-copy": copyText(tsv(b), "Tableau récapitulatif"); break;
    case "insert": {
      const cat = parseBank()[+el.dataset.c]; if(!cat) break;
      const s = findStudent(ui.lastApp);
      if(!s){ toast("Cliquez d’abord dans une appréciation"); break; }
      const phrase = cat.p[+el.dataset.p].replace(/\{prenom\}/gi, s.prenom);
      s.appTechno = (s.appTechno.trim() ? s.appTechno.trim()+" " : "") + phrase;
      const ta = document.getElementById("ta-"+s.id);
      if(ta){ ta.value = s.appTechno; ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
      setCC(s.id, s.appTechno);
      save(); break; }
    case "sync-connect": {
      const f = document.getElementById("syncPass"), pass = f ? f.value : "";
      if(pass.length < 8){ setSync("err", "La phrase doit faire au moins 8 caractères."); break; }
      const rem = !!(document.getElementById("syncRemember")||{}).checked;
      if(f) f.value = "";
      connectSync(pass, rem); break; }
    case "sync-now": reconcile(false); break;
    case "sync-keep-remote": { const c = sync.conflict; sync.conflict = null; if(c) applyRemote(c.doc).then(render); break; }
    case "sync-keep-local": sync.conflict = null; render(); doPush(); break;
    case "gen-apps": {
      const r = generateMany(b, true); save(); render();
      toast(r.n ? `${r.n} appréciation${r.n>1?"s":""} rédigée${r.n>1?"s":""}${r.miss?`, ${r.miss} sans note de techno`:""}` : (r.miss ? `${r.miss} élève${r.miss>1?"s":""} sans note de techno` : "Toutes les appréciations sont déjà rédigées"));
      break; }
    case "gen-one": {
      const s = findStudent(id); if(!s || s.techno==null) break;
      generateApp(s, usageMap(b, s), true); refreshAppRow(s);
      el.textContent = "Autre version"; ui.lastApp = s.id; save(); break; }
    case "copy-app": { const s = findStudent(id); if(s) copyText(s.appTechno, "Appréciation de "+full(s)); break; }
    case "ed-script": {
      const items = sorted(b.students,"nom").filter(x=>x.appTechno.trim());
      if(!items.length){ toast("Aucune appréciation à transférer"); break; }
      const over = items.filter(x=>x.appTechno.length>APP_LIMIT).length;
      copyText(edScript(items), "Script École Directe");
      ui.edHelp = true; ui.edOver = over; render();
      break; }
    case "ed-close": ui.edHelp = false; render(); break;
    case "copy-all-app": copyText(sorted(b.students,"nom").map(s=>`${s.nom}\t${s.prenom}\t${fmt(s.techno)}\t${s.appTechno.replace(/[\t\r\n]+/g," ")}`).join("\n"), "Appréciations techno"); break;
    case "import-csv": {
      const fs = document.getElementById("csvFile").files, p = document.getElementById("csvPaste").value;
      if(ui.dropRows){
        const d = ui.dropRows;
        doImportRows(d.rows, {cls:document.getElementById("impCls").value, tri:document.getElementById("impTri").value}, {fname:d.fname});
      }
      else if(p.trim()) doImport(p, "Texte collé");
      else if(fs && fs.length){
        Array.from(fs).forEach(f=>{
          readAnyFile(f).then(rows=>doImportRows(rows, detectMeta(rows, f.name), {fname:f.name}))
            .catch(()=>{ ui.importMsg = f.name + " : lecture impossible. Enregistrez-le en CSV puis réessayez."; render(); });
        });
      }
      else toast("Choisissez ou déposez un fichier, ou collez des lignes");
      break; }
    case "copy-roster": {
      const from = peek(state.cur.cls, document.getElementById("fromTri").value); if(!from) break;
      if(b.example){ b.students = []; b.example = false; b.bilan = ""; }
      const have = new Set(b.students.map(s=>norm(full(s)))); let n = 0;
      from.students.forEach(s=>{ if(!have.has(norm(full(s)))){ b.students.push(newStudent({nom:s.nom, prenom:s.prenom})); n++; } });
      save(); render(); toast(`${n} élève${n>1?"s":""} repris`); break; }
    case "export-dl": download(`conseils-de-classe-${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(state,null,1), "application/json"); break;
    case "export-copy": copyText(JSON.stringify(state), "Sauvegarde"); break;
    case "ask": ui.ask = el.dataset.what; render(); break;
    case "cancel-ask": ui.ask = null; render(); break;
    case "do": doConfirmed(el.dataset.what); break;
    case "close-modal": document.getElementById("modal").hidden = true; break;
  }
}
function doConfirmed(what){
  ui.ask = null;
  const k = key(state.cur.cls, state.cur.tri);
  if(what==="clear-example" || what==="reset-book"){ state.data[k] = emptyBook(); toast("Liste vidée"); }
  else if(what==="reset-class"){
    TRIS.forEach(t=>{ delete state.data[key(state.cur.cls,t[0])]; });
    ui.open = null; ui.idx = 0; toast("La "+state.cur.cls+" est effacée");
  }
  else if(what==="reset-all"){ state.data = {}; toast("Toutes les données sont effacées"); }
  else if(what==="sync-off"){ disconnectSync(); return; }
  else if(what==="gen-all"){ const r = generateMany(book(), false); toast(`${r.n} appréciation${r.n>1?"s":""} rédigée${r.n>1?"s":""}${r.miss?`, ${r.miss} sans note de techno`:""}`); }
  else if(what.startsWith("delprof:")){ const b = book(); b.profs = (b.profs||[]).filter(p=>p.id!==what.slice(8)); refreshBilan(); }
  else if(what.startsWith("del:")){ const b = book(); b.students = b.students.filter(s=>s.id!==what.slice(4)); ui.open = null; }
  else if(what==="restore"){
    const p = document.getElementById("jsonPaste").value, f = document.getElementById("jsonFile").files[0];
    const apply = txt => {
      try{
        const s = JSON.parse(txt);
        if(!s || s.v!==1 || !s.data) throw 0;
        state = Object.assign(freshState(), s, {data:s.data}); save(); render(); toast("Sauvegarde restaurée");
      }catch(e){ toast("Ce fichier n’est pas une sauvegarde de cette appli"); render(); }
    };
    if(p.trim()) apply(p);
    else if(f){ const r = new FileReader(); r.onload = () => apply(String(r.result)); r.readAsText(f); }
    else { toast("Choisissez un fichier ou collez une sauvegarde"); render(); }
    return;
  }
  save(); render();
}

/* ---------- événements ---------- */
document.addEventListener("click", e=>{
  const el = e.target.closest("[data-act]");
  if(el && !el.disabled){ if(el.type!=="checkbox") e.preventDefault(); act(el); return; }
  if(e.target.id==="modal") document.getElementById("modal").hidden = true;
});
document.addEventListener("input", e=>{
  const t = e.target;
  if(t.dataset.sfield){
    const s = findStudent(t.dataset.id); if(!s) return;
    const f = t.dataset.sfield;
    s[f] = (f==="moy" || f==="techno" || f==="bav") ? parseNum(t.value) : (f==="nom" ? t.value.toUpperCase() : t.value);
    if(f==="bav"){
      const v = bavOf(s), bl = document.getElementById("bl-"+s.id);
      if(bl){ bl.textContent = BAV_LABELS[v]; bl.className = "bav-val lvl-"+v; }
      t.className = "lvl-"+v;
    }
    if(f==="appTechno") setCC(s.id, t.value);
    if(f==="notes"){
      const tl = document.getElementById("tasks-"+s.id); if(tl) tl.innerHTML = taskItems(s, key(state.cur.cls,state.cur.tri));
      const nl = document.getElementById("ns-"+s.id); if(nl) nl.innerHTML = noteLine(s);
      const n = pendingCount(book()), bd = document.getElementById("pendBadge");
      if(bd) bd.textContent = n; else if(n) renderHeader();
    }
    save(); return;
  }
  if(t.dataset.pfield){
    const b = book(), p = (b.profs||[]).find(x=>x.id===t.dataset.pid); if(!p) return;
    p[t.dataset.pfield] = t.value;
    refreshBilan();
    const pre = document.getElementById("crText"); if(pre) pre.textContent = crText(b);
    save(); return;
  }
  if(t.dataset.bfield){
    if(t.dataset.bfield==="bilan"){ book().bilanAuto = false; book().bilanBy = ""; const m = document.getElementById("bilanMode"); if(m) m.textContent = "Modifié à la main"; }
    book()[t.dataset.bfield] = t.value;
    const pre = document.getElementById("crText"); if(pre) pre.textContent = crText(book());
    save(); return;
  }
  if(t.dataset.seuil){ const n = parseNum(t.value); if(n!=null){ state.seuils[t.dataset.seuil] = n; save(); } return; }
  if(t.dataset.field==="q"){ ui.q = t.value; const tb = document.getElementById("prepRows"); if(tb) tb.innerHTML = prepRows(book()); return; }
  if(t.dataset.field==="bank"){ state.bank = t.value; save(); return; }
});
document.addEventListener("change", e=>{
  const t = e.target;
  if(t.dataset.field==="cls"){ state.cur.cls = t.value; ui.idx = 0; ui.open = null; ui.ask = null; save(); render(); }
  else if(t.dataset.field==="tri"){ state.cur.tri = t.value; ui.idx = 0; ui.open = null; ui.ask = null; save(); render(); }
  else if(t.dataset.field==="sort"){ ui.sort = t.value; const tb = document.getElementById("prepRows"); if(tb) tb.innerHTML = prepRows(book()); }
  else if(t.dataset.sfield==="bav" || t.dataset.sfield==="techno"){
    /* une appréciation rédigée automatiquement et non retouchée suit le curseur et la note */
    const s = findStudent(t.dataset.id);
    if(s && s.techno!=null && s.appKeys && s.appAuto===s.appTechno && s.appKeys.join()!==genKeys(s).join()){
      generateApp(s, usageMap(book(), s), false); refreshAppRow(s); save();
    }
  }
});
document.addEventListener("focusin", e=>{
  const t = e.target;
  if(t.dataset && t.dataset.sfield==="appTechno"){
    ui.lastApp = t.dataset.id;
    document.querySelectorAll(".app-row.active").forEach(r=>r.classList.remove("active"));
    const r = document.getElementById("row-"+t.dataset.id); if(r) r.classList.add("active");
  }
});
document.addEventListener("keydown", e=>{
  if(e.key==="Enter" && e.target && e.target.id==="syncPass"){ e.preventDefault(); const b = document.querySelector('[data-act="sync-connect"]'); if(b) act(b); return; }
  if(e.key==="Escape" && !document.getElementById("modal").hidden){ document.getElementById("modal").hidden = true; return; }
  if(state.cur.view!=="live") return;
  const tag = (document.activeElement && document.activeElement.tagName) || "";
  if(tag==="TEXTAREA" || tag==="INPUT" || tag==="SELECT") return;
  const n = book().students.length;
  if(e.key==="ArrowRight" && ui.idx < n-1){ ui.idx++; render(); }
  else if(e.key==="ArrowLeft" && ui.idx > 0){ ui.idx--; render(); }
});

/* ---------- glisser-déposer sur toute la page ---------- */
let dragDepth = 0;
const hasFiles = e => e.dataTransfer && Array.from(e.dataTransfer.types||[]).includes("Files");
function showDrop(on){ const z = document.getElementById("dropzone"); if(z) z.hidden = !on; }
document.addEventListener("dragenter", e=>{ if(!hasFiles(e)) return; e.preventDefault(); dragDepth++; showDrop(true); });
document.addEventListener("dragover", e=>{ if(!hasFiles(e)) return; e.preventDefault(); e.dataTransfer.dropEffect = "copy"; });
document.addEventListener("dragleave", e=>{ if(!hasFiles(e)) return; dragDepth = Math.max(0, dragDepth-1); if(!dragDepth) showDrop(false); });
document.addEventListener("drop", e=>{
  if(!hasFiles(e)) return;
  e.preventDefault(); dragDepth = 0; showDrop(false);
  importFiles(e.dataTransfer.files);
});
document.addEventListener("change", e=>{ if(e.target && e.target.id==="csvFile" && e.target.files.length && !ui.dropRows) importFiles(e.target.files).then(()=>{ const f = document.getElementById("csvFile"); if(f) f.value = ""; }); });

render();
initSync();
</script>
